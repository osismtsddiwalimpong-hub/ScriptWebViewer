<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>
    <style>
        /* Gaya tampilan (CSS) sederhana agar web terlihat rapi */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .kartu {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
        }
        .tombol {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .tombol:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="kartu">
        <!-- Foto Profil (Ganti nama file gambar sesuai milikmu) -->
        <img src="foto-profil.jpg" alt="Foto Profil Saya">
        
        <!-- Judul dan Biodata -->
        <h1>Halo, Selamat Datang!</h1>
        <p>Nama saya <strong>[Nama Kamu]</strong>. Saya adalah siswa SMP kelas [Kelas Kamu].</p>
        <p>Ini adalah website pertama yang saya buat menggunakan coding HTML dan CSS!</p>
        
        <!-- Link atau Tombol Interaktif -->
        <a href="https://google.com" target="_blank" class="tombol">Buka Google</a>
    </div>

</body>
</html>
